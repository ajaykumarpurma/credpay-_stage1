


pool:
  vmImage: ubuntu-latest
variables:
  acrserviceconnection: 'acr-connection'
  frontendrepository: 'credpay/frontend'
  userrepository: 'credpay/user-service'
  paymentrepository: 'credpay/payment-service'
  tag: '$(Build.BuildId)'
stages:
  - stage: terraform
    displayName: terraform infra
    jobs:
      - job: terraformapply
        displayName: terrform init & apply
        steps:
          - checkout: self
          - task: TerraformInstaller@1
            inputs:
              terraformVersion: 'latest'
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: Terraform
              backendServiceArm: 'AV1929-manul'
              backendAzureRmResourceGroupName: 'capstone-RG'
              backendAzureRmStorageAccountName: 'credpayproject34'
              backendAzureRmContainerName: 'statefile'
              backendAzureRmKey: 'credpay.terraform.tfstate'
              
          
          
      













